<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Encoder / Decoder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap');

  :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --surface2: #1c1c22;
      --border: #2a2a35;
      --accent: #00BCD4;
      --accent2: #87b8bf;
      --text: #00BCD4;
      --code-text: #e8e8f0;
      --muted: #6b9ba0;
      --muted2: #00BCD422;
      --muted3: #00BCD477;
      --btn-highlight: #0077d3;
      --btn-h: 40px;
  }

  * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
  }

  body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 8px;
  }

  h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
  }
  
  .shadow {
	  text-shadow: 2px 2px var(--muted3)
  }

  .main-container {
      display: flex;
      flex-direction: column;
      width: 80vw;
      max-width: 1200px;
  }
  .side-code-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 80vw;
      max-width: 1200px;
  }


    .side-container {
      display: flex;
      flex-direction: column;
      align-items: center;     /* THIS WAS APPLYING  CLEARLY SOMETHIG IS OVERRIDING IT NOW  -- CLAUDE ?? */
      justify-content: center;
      gap: 12px;
      width: 5vw;
      max-width: 60px;
      height: auto;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      padding: 5px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: var(--bg);
  }
    .side-labels {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
  }
  .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 10px 0px 10px 0px;
  }

  .center-btns {
	  align-items: center;
	  height: 100%;
  }
  .title {
      justify-content: center;
      align-items: center;
  }
  
  .live {
	  font-size: 14px;
	  padding: 7px 0px 7px 7px;
	  text-transform: capitalize;
  }
  
  input[type="checkbox"] {
    transform: rotate(90deg);
    accent-color: var(--accent);
}
    
  .desc-text {
      width: fit-content;
      min-height: fit-content;
      background: var(--muted2);  
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      border: 1px solid var(--border);   
      border-radius: 8px;
      padding: 12px;
      resize: vertical;
      outline: none;
  }
  
  textarea {
      width: 100%;
      min-height: 30vh;
      background: var(--surface2);
      color: var(--code-text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      resize: vertical;
      outline: none;
  }

  textarea:focus {
      border-color: var(--accent2);
  }

  .buttons {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      height: calc(var(--btn-h) + 16px);
  }
  
  .copy {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: center;
      height: calc(var(--btn-h) + 16px);
  }

  .btn {
      height: var(--btn-h);
      background: var(--surface2);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      padding: 0 20px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 2px var(--accent),
                   -2px -2px 2px #777777;
      transition: box-shadow 0.15s, transform 0.1s;
	  
  }
  .btn.active{
	  transform: translateY(2px);
	  box-shadow: 1px 1px 1px var(--accent), 
                   -2px -2px 2px #777777cent),
                  -1px -1px 2px #444;
  }
  
  .btn.active-highlight {
/*      box-shadow: 2px 2px 2px #000ed3,
                   -2px -2px 2px #777777;
      color: #000ed3;*/
      box-shadow: 2px 2px 2px var(--btn-highlight),
                   -2px -2px 2px #777777;
      color: var(--btn-highlight);
  }
   
  .btn-left-pad {
	  margin-left: 30px;
  } 

  .btn-right-pad {
	  margin-right: 30px;
  } 
   
  .btn-wrap-h {
	  height: 56px;
	  /*height: calc(var(--btn-h) + 16px);*/
  }
   


/*  .btn-copy {
      font-size: 13px;
      padding: 0 14px;
      color: var(--muted);
  }*/

  .label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: var(--text);
      padding: 0 2px;
  }
</style>
</head>
<body>
<!--    <h1 class="shadow">URL Encoder / Decoder</h1> -->
    <div class="main-container">
        <div class="container title">
            <h1 class="shadow">URL Encoder / Decoder</h1>     <!--   SHOULD this be centered over the code input OR the entire page   i can fix it buti wanted ou  opinion on what would be better (fixing is amttr of puilling it back outside and nothavinging a side container)   -->
        </div>
        <!--		<div class="desc-text">Need to URL Encode or Decode some text, data, etc? Just type or paste in the input box then click either Encode or Decode then you can click copy to copy the result. ____SENTENCE ABOUT RESULT TO INPUT BUTTON_____. By default, typed/pasted text is live translasted; if you prefer to disable this functionality uncheck Live.</div>  -->
		<div class="desc-text">Paste or type below. Auto-detects encode/decode. Hit Copy to grab the result. If you prefer to disable auto-detect, unselect Live.</div>
    </div>
    <div class="main-container">
		<div class="side-code-wrap">
            <div class="side-container">
	    		<div class="side-label">Input</div>
		    </div>
            <div class="container">
                <textarea id="input" placeholder="Enter text to encode or decode..."></textarea>
            </div>
        </div>
        
		<div class="side-code-wrap">        
            <div id="live-btn" class="side-container">
	    		<div class="side-label">
					<input id="live-label" type="checkbox" checked></input><span class="live">Live</span>
	    		</div>
		    </div>
            <div class="container btn-wrap-h">
                <div id="mid-btn" class="buttons center-btns">
                    <div class="btn btn-left-pad" id="btnEncode">Encode</div>
                    <div class="btn" id="btnSwap">⇅ Swap</div>
                    <div class="btn btn-right-pad" id="btnDecode">Decode</div>
                </div>
            </div>
        </div>
		<div class="side-code-wrap">
            <div class="side-container">
    			<div class="side-label">Output</div>
            </div>
            <div class="container">
                <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
            </div>    
        </div>
		<div class="side-code-wrap">
            <div class="side-container">
    			<div class="side-label"></div>
            </div>
            <div class="container">
                <div class="buttons copy">
                    <div class="btn" id="btnCopy">Copy</div>
                </div>
            </div>    
        </div>
    </div>
  
<script>

document.getElementById('live-label').addEventListener('change', function() {
    if (!this.checked) {
        input.removeEventListener('input', check);
    } else {
        input.addEventListener('input', check);
    }
});



  const input = document.getElementById('input');
  const output = document.getElementById('output');

// add listener on page load
input.addEventListener('input', handleInput);

function handleInput() {
    check(this.value);
}

// toggle
document.getElementById('live-label').addEventListener('change', function() {
    if (this.checked) {
        input.addEventListener('input', handleInput);
        output.placeholder = 'Result will appear here...';
    } else {
        input.removeEventListener('input', handleInput);
        output.value = '';
        removeHighlightButton();
        output.placeholder = 'Click Encode or Decode to process...';
    }
});


// If iunput box is empty output box is empty
input.addEventListener('input', function() {
    if (input.value === '') {
        output.value = '';
        removeHighlightButton();
    }
});


  function animateBtn(btn) {
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 200);
  }

  document.getElementById('btnEncode').addEventListener('click', function() {
    animateBtn(this);
    try {
      output.value = encodeURIComponent(input.value);
    } catch(e) {
      output.value = 'Error: ' + e.message;
    }
  });

  document.getElementById('btnDecode').addEventListener('click', function() {
    animateBtn(this);
    try {
      output.value = decodeURIComponent(input.value);
    } catch(e) {
      output.value = 'Error: invalid encoded string';
    }
  });

  document.getElementById('btnSwap').addEventListener('click', function() {
    animateBtn(this);
    const temp = input.value;
    input.value = output.value;
    output.value = temp;
  });

  document.getElementById('btnCopy').addEventListener('click', function() {
    animateBtn(this);
    if (output.value) {
      navigator.clipboard.writeText(output.value).then(() => {
        const orig = this.textContent;
        this.textContent = 'Copied!';
        setTimeout(() => this.textContent = orig, 1500);
      });
    }
  });
  
  //set height of area containing 3 buttons min page to height of adjacent side container
  liveBtnHeight = document.getElementById('live-btn').offsetHeight;

  midBtnWrap = document.querySelector('.btn-wrap-h');
  midBtn = document.getElementById('mid-btn');
  midBtnWrap.style.height = liveBtnHeight + 'px';
  midBtn.style.height = liveBtnHeight + 'px';
  
//commented until fixed  
  //center "Live" text by ckeck box LR (no padding currently as centering doesnt APPEAR to work using TRADITIONAL CSS
  sideContWidth = document.querySelector('.side-container').offsetWidth;
  live = document.querySelector('.live');
  padLR = Math.floor(sideContWidth / 2) + 'px';
  padTB = '7px';
  live.style.padding = 'padTB padLR padTB padLR';
  
  
  //Auto Detect if Inpit is to be Encoded or Decoded
function check(val) {
	const inputValue = document.getElementById('input').value;
	const input = document.getElementById('input');
    const output = document.getElementById('output');
	console.log('CHANGE DETECTED', val);
	regex = /<|>|\+|#/;
	regexPercentStartAny = /^%./;
	regexPercentStart = /^%/;
	regexPercentStartOneExtra = /^%[\S]{1}$/;
	regexPercentStartOnly = /^%$/;
	regexEmpty = /''/;
	match = regex.test(inputValue);
	matchPercentStart = regexPercentStart.test(inputValue);
	matchPercentStartOnly = regexPercentStartOnly.test(inputValue);
	matchPercentStartAny = regexPercentStartAny.test(inputValue);
	matchPercentStartOneExtra = regexPercentStartOneExtra.test(inputValue);
	matchEmpty = regexEmpty.test(inputValue);
	console.log('✅REGEX: match = ', match);
	console.log('1️⃣REGEX: matchPercentStart = ', matchPercentStart);
	console.log('2️⃣REGEX: matchPercentStartOnly = ', matchPercentStartOnly);
	console.log('4️⃣REGEX: matchPercentStartAny = ', matchPercentStartAny);
	console.log('3️⃣REGEX: matchPercentStartOneExtra = ', matchPercentStartOneExtra);
    if (inputValue === '') {
    	removeHighlightButton() 
    }
    else {
    	if (match === true) {
    		console.log('Match Found: Encode');
    		try {
    			output.value = encodeURIComponent(input.value);
    			removeHighlightButton();
    			highlightButtonAutoDetect('btnEncode');
            } catch(e) {
    			output.value = 'Error: ' + e.message;
            }
    	}
    	else if (matchPercentStart === true) {
    		console.log('[matchPercentStart] % Is first character');
    		    if (matchPercentStartOnly === true) {
    				console.log('[matchPercentStartOnly] % Is ONLY character: DO NOT ENCODE OR DECODE YET');
    				output.value = 'waiting on additional characters for auto-detect';
    				removeHighlightButton();
    			}
    			else if (matchPercentStartOneExtra === true) {
    			    try {
    					console.log('[matchPercentStart, matchPercentStartOneExtra] % Is first character WITH ONE other character, TRY encode, if fail decode');
    					output.value = encodeURIComponent(input.value);
            			removeHighlightButton();
    			        highlightButtonAutoDetect('btnEncode');
    				} catch(e) {
    					console.log('[matchPercentStart, matchPercentStartOneExtra] % Is first character WITH ONE other character, decode');
    					output.value = decodeURIComponent(input.value);
    					removeHighlightButton();
    			        highlightButtonAutoDetect('btnDecode');
                    }
    			}
    			else if (matchPercentStartAny === true) {
    			    try {
    					console.log('[matchPercentStart, matchPercentStartAny] % Is first character WITH other characters, try decode, fail encode');
    					output.value = decodeURIComponent(input.value);
    					removeHighlightButton();
    			        highlightButtonAutoDetect('btnDecode');		
    				} catch(e) {
    					console.log('[matchPercentStart, matchPercentStartAny] % Is first character WITH other characters, encode');
    					output.value = encodeURIComponent(input.value);
    					removeHighlightButton();
    			        highlightButtonAutoDetect('btnEncode');
                    }
    			}
    	}
    	else {
    		console.log('Match Not Found: Decode');
    	    try {
    			output.value = decodeURIComponent(input.value);
    			removeHighlightButton();
    			highlightButtonAutoDetect('btnDecode');
            } catch(e) {
    			output.value = 'Error: invalid encoded string';
            }
    	}
    }

}

function removeHighlightButton() {
	// remove from both first
	document.getElementById('btnEncode').classList.remove('active-highlight');
	document.getElementById('btnDecode').classList.remove('active-highlight');
}

function highlightButtonAutoDetect(val) {
	// add to whichever won    // 	document.getElementById('btnEncode').classList.add('active-mode'); 	// OR  //    document.getElementById('btnDecode').classList.add('active-mode');
	document.getElementById(val).classList.add('active-highlight');
}


</script>

</body>
</html>

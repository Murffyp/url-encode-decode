<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Encoder / Decoder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --surface2: #1c1c22;
    --border: #2a2a35;
    --accent: #00BCD4;
    --text: #e8e8f0;
    --muted: #6b9ba0;
    --btn-h: 40px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 8px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 75vw;
    max-width: 900px;
  }

  textarea {
    width: 100%;
    min-height: 30vh;
    background: var(--surface2);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    resize: vertical;
    outline: none;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  .buttons {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    height: calc(var(--btn-h) + 16px);
  }

  .btn {
    height: var(--btn-h);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border-radius: 8px;
    padding: 0 20px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 4px var(--accent),
                -2px -2px 4px #444;
    transition: box-shadow 0.15s, transform 0.1s;
  }

  .btn:active, .btn.active {
    transform: translateY(2px);
    box-shadow: 1px 1px 2px var(--accent),
                -1px -1px 2px #444;
  }

  .btn-copy {
    font-size: 13px;
    padding: 0 14px;
    color: var(--muted);
  }

  .output-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    padding: 0 2px;
  }
</style>
</head>
<body>

<h1>URL Encoder / Decoder</h1>

<div class="container">
  <textarea id="input" placeholder="Enter text to encode or decode..."></textarea>

  <div class="buttons">
    <div class="btn" id="btnEncode">Encode</div>
    <div class="btn" id="btnSwap">⇅ Swap</div>
    <div class="btn" id="btnDecode">Decode</div>
  </div>

  <div class="output-label">
    <span>Output</span>
    <div class="btn btn-copy" id="btnCopy">Copy</div>
  </div>

  <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');

  function animateBtn(btn) {
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 200);
  }

  document.getElementById('btnEncode').addEventListener('click', function() {
    animateBtn(this);
    try {
      output.value = encodeURIComponent(input.value);
    } catch(e) {
      output.value = 'Error: ' + e.message;
    }
  });

  document.getElementById('btnDecode').addEventListener('click', function() {
    animateBtn(this);
    try {
      output.value = decodeURIComponent(input.value);
    } catch(e) {
      output.value = 'Error: invalid encoded string';
    }
  });

  document.getElementById('btnSwap').addEventListener('click', function() {
    animateBtn(this);
    const temp = input.value;
    input.value = output.value;
    output.value = temp;
  });

  document.getElementById('btnCopy').addEventListener('click', function() {
    animateBtn(this);
    if (output.value) {
      navigator.clipboard.writeText(output.value).then(() => {
        const orig = this.textContent;
        this.textContent = 'Copied!';
        setTimeout(() => this.textContent = orig, 1500);
      });
    }
  });
</script>

</body>
</html>
